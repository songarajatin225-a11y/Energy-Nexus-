<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Detail · Energy Nexus</title>
<meta name="description" content="Deep dive into a single industrial site: live energy state, assets, agent activity and verified savings.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/charts.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app">
  <main class="page" id="main">
    <div class="page-header">
      <div class="page-header__text">
        <div class="eyebrow"><a href="sites.html" style="color:inherit">Sites</a> · <span data-site-id>—</span></div>
        <h1 data-site-name>—</h1>
        <p class="page-header__sub" data-site-meta>—</p>
      </div>
      <div class="page-header__actions">
        <span data-site-tier></span>
        <a class="btn" href="digital-twin.html">Digital twin</a>
        <a class="btn btn--primary" href="optimisation.html">Optimise</a>
      </div>
    </div>

    <div class="kpi-strip" data-site-kpis></div>

    <section class="section grid grid--sidebar-right">
      <div class="card">
        <div class="chart-panel__toolbar">
          <div>
            <div class="card__title">24-hour energy profile</div>
            <div class="card__desc">Load, grid, solar and battery against tariff blocks</div>
          </div>
          <span class="pill pill--live pill--pulse"><span class="pill__dot"></span>Live</span>
        </div>
        <div class="chart-panel__body"><div data-site-chart></div></div>
      </div>

      <div class="stack">
        <div class="card">
          <div class="card__header"><div class="card__title">Battery</div></div>
          <div class="card__body" style="display:flex;align-items:center;gap:var(--sp-5)">
            <div data-soc-gauge></div>
            <div style="flex:1" data-bess-detail></div>
          </div>
        </div>
        <div class="card">
          <div class="card__header"><div class="card__title">Verified savings</div></div>
          <div class="card__body card__body--tight" data-site-savings></div>
        </div>
      </div>
    </section>

    <section class="section grid grid--2">
      <div class="card">
        <div class="card__header">
          <div class="card__title">Agent activity</div>
          <a class="btn btn--sm btn--ghost" href="agent.html">All decisions</a>
        </div>
        <div data-site-decisions></div>
      </div>
      <div class="card">
        <div class="card__header">
          <div class="card__title">Open alerts</div>
          <a class="btn btn--sm btn--ghost" href="dashboard.html#alerts">Alert centre</a>
        </div>
        <div data-site-alerts></div>
      </div>
    </section>

    <section class="section">
      <div class="section__header">
        <div><h2 class="section__title">Site assets</h2></div>
      </div>
      <div class="card"><div class="table-wrap"><table class="table">
        <thead><tr><th>Asset</th><th>Type</th><th class="num">Rated</th><th class="num">Utilisation</th><th class="num">Health</th><th>Control</th><th>Status</th></tr></thead>
        <tbody data-site-assets></tbody>
      </table></div></div>
    </section>
  </main>
</div>
<script src="js/router.js" defer></script>
<script src="js/data.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/charts.js" defer></script>
<script src="js/twin.js" defer></script>
<script src="js/site-detail.js" defer></script>
</body>
</html>
